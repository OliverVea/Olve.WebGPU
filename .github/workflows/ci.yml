name: CI

on:
  # Every PR, including PRs stacked on another PR's branch
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Package version
        type: string
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERSION: ${{ inputs.version || format('0.1.0-ci.{0}', github.run_number) }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

jobs:
  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-15-intel }
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      PYTHON: ${{ matrix.rid == 'win-x64' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
          global-json-file: global.json
      - name: Install lavapipe (Vulkan on the CPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Download Dawn
        run: scripts/download-dawn.sh
      - name: Link webgpu_dawn and the layout checker
        run: scripts/build-natives.sh
      - name: Check dawn.json, the emdawnwebgpu port and the generated code match the pin
        if: runner.os == 'Linux'
        run: |
          source scripts/common.sh
          curl -sSfL "https://raw.githubusercontent.com/google/dawn/$DAWN_COMMIT/src/dawn/dawn.json" -o artifacts/dawn.json
          cmp artifacts/dawn.json dawn/dawn.json || { echo "::error::dawn/dawn.json differs from DAWN_COMMIT's"; exit 1; }
          curl -sSfL "https://github.com/google/dawn/releases/download/$DAWN_TAG/emdawnwebgpu-$DAWN_TAG.remoteport.py" -o artifacts/emdawnwebgpu.remoteport.py
          cmp artifacts/emdawnwebgpu.remoteport.py src/Olve.WebGPU.Browser/port/emdawnwebgpu.remoteport.py || { echo "::error::the emdawnwebgpu remote port differs from DAWN_TAG's"; exit 1; }
          dotnet run --project generator -c Release
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)" || { echo "::error::regenerating changed or added files: commit the generator output"; exit 1; }
      - name: Build
        run: dotnet build tests/Olve.WebGPU.Tests -c Release -p:Version=$VERSION
      - name: Test (layout check, offscreen readback)
        run: dotnet run --project tests/Olve.WebGPU.Tests -c Release --no-build -- --output Detailed
      - name: Build the desktop sample
        run: dotnet build samples/Triangle.Desktop -c Release -p:Version=$VERSION
      - name: Run the desktop sample in a window (the CAMetalLayer host)
        if: runner.os == 'macOS'
        run: dotnet run --project samples/Triangle.Desktop -c Release --no-build -- --frames 60
      - name: Build the Avalonia sample
        run: dotnet build samples/Triangle.Avalonia -c Release -p:Version=$VERSION
      - name: Run the Avalonia sample's viewport for 60 frames
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get install -y --no-install-recommends xvfb
            xvfb-run -a -s "-screen 0 1280x800x24" dotnet run --project samples/Triangle.Avalonia -c Release --no-build -- --frames 60
          else
            dotnet run --project samples/Triangle.Avalonia -c Release --no-build -- --frames 60
          fi
      - name: Run the benchmarks once (a dry job, so they keep building and running; real runs are off-cadence)
        if: runner.os == 'Linux'
        run: dotnet run --project benchmarks/Olve.WebGPU.Benchmarks -c Release -p:Version=$VERSION -- --filter '*' --job Dry --inProcess
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}/
            artifacts/layout-check/${{ matrix.rid }}/
          if-no-files-found: error

  android:
    name: Native (android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The NDK Dawn's own Android build uses (google/dawn .github/workflows/ci.yml at DAWN_COMMIT)
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
      - name: Link webgpu_dawn and the layout checker for android-arm64 and android-x64
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for rid in android-arm64 android-x64; do
            RID=$rid scripts/download-dawn.sh
            RID=$rid scripts/build-natives.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: native-android
          path: |
            artifacts/native/android-*/
            artifacts/layout-check/android-*/
          if-no-files-found: error

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    env:
      MSBUILDDISABLENODEREUSE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install ios
      # .NET for iOS needs the Xcode it was built against; the runner's default can be older
      - name: Select the Xcode the ios workload needs
        run: |
          ls -d /Applications/Xcode*.app
          required="$(dotnet build tests/Olve.WebGPU.Tests.iOS -c Release 2>&1 | sed -nE 's/.*requires Xcode ([0-9.]+)\..*/\1/p' | head -1)"
          echo "the workload requires Xcode ${required:-(no requirement reported)}"
          if [[ -n "$required" ]]; then
            # The image's Xcode_<major.minor>.app is a symlink; tools looked up through a path in it aren't found, so name the real one
            xcode="$(cd "/Applications/Xcode_$required.app" && pwd -P)"
            echo "using $xcode"
            sudo xcode-select -s "$xcode"
            # xcrun follows DEVELOPER_DIR; the iOS SDK follows XcodeLocation (an MSBuild property, also read from the environment)
            # before the runner image's Settings.plist, which names its default Xcode
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "XcodeLocation=$xcode" >> "$GITHUB_ENV"
          fi
          # An Xcode other than the image's default may not have run its first-launch setup, which installs its tools
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          # The iOS build looks these up; print where they are, or that they aren't
          xcrun -find install_name_tool || true
          xcrun -sdk macosx -find install_name_tool || true
          xcodebuild -sdk macosx -find install_name_tool || true
          ls -l "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin/install_name_tool" || true
          # The trial build above left MSBuild nodes running with the default Xcode's environment; later builds would reuse them
          dotnet build-server shutdown
      - name: Dawn's iOS libraries, and the layout checker for the simulator
        run: |
          for rid in ios-arm64 iossimulator; do
            RID=$rid scripts/download-dawn.sh
            RID=$rid scripts/build-natives.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: native-ios
          path: |
            artifacts/native/ios-arm64/
            artifacts/native/iossimulator/
          if-no-files-found: error
      - name: Build the iOS test runner (project references)
        run: dotnet build tests/Olve.WebGPU.Tests.iOS -c Release -p:Version=$VERSION
      - name: Show what the iOS build linked
        run: |
          dotnet msbuild tests/Olve.WebGPU.Tests.iOS -p:Configuration=Release -getItem:NativeReference -getProperty:_OlveWebGPUPlatform -getProperty:_OlveWebGPUIosSlice -getProperty:OlveWebGPUIosLibraries | head -40
          echo "ReferenceNativeSymbol items: $(dotnet msbuild tests/Olve.WebGPU.Tests.iOS -p:Configuration=Release -getItem:ReferenceNativeSymbol | grep -c '"Identity"')"
          app="$(find tests/Olve.WebGPU.Tests.iOS/bin/Release -name '*.app' -maxdepth 3 | head -1)"
          echo "wgpu symbols in the app's executable: $(nm -gU "$app/Olve.WebGPU.Tests.iOS" | grep -c ' _wgpu')"
          nm -gU "$app/Olve.WebGPU.Tests.iOS" | grep -E ' _(wgpuCreateInstance|wgpu_layout_values|dawn_layout_values)$' || echo "not exported: _wgpuCreateInstance"
      - name: Run the checks in an iPhone simulator
        timeout-minutes: 15
        run: scripts/run-ios-tests.sh "$(find tests/Olve.WebGPU.Tests.iOS/bin/Release -name '*.app' -maxdepth 3 | head -1)"

  browser:
    name: Browser (wasm, headless Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          pip install playwright pillow
          playwright install --with-deps chromium
      - name: Publish the browser tests (project references)
        run: dotnet publish tests/Olve.WebGPU.Tests.Browser -c Release -o artifacts/web/tests -p:Version=$VERSION
      - name: Run the browser tests (layout check against emdawnwebgpu, offscreen readback)
        run: python scripts/verify-web.py artifacts/web/tests/wwwroot tests
      - name: Pack Olve.WebGPU and Olve.WebGPU.Browser
        run: |
          dotnet pack src/Olve.WebGPU -c Release -o artifacts/packages -p:Version=$VERSION
          dotnet pack src/Olve.WebGPU.Browser -c Release -o artifacts/packages -p:Version=$VERSION
      - name: Publish the web sample (from the packages)
        run: dotnet publish samples/Triangle.Web -c Release -o artifacts/web/triangle -p:Version=$VERSION -p:NativeSource=package
      - name: Run the web sample (canvas pixels)
        run: python scripts/verify-web.py artifacts/web/triangle/wwwroot triangle --screenshot artifacts/web/triangle.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-triangle-screenshot
          path: artifacts/web/triangle.png
          if-no-files-found: ignore

  pack:
    name: Pack
    needs: [native, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - run: find artifacts -type f | sort
      - name: Pack
        run: |
          for project in src/Olve.WebGPU src/Olve.WebGPU.Native src/Olve.WebGPU.Browser; do
            dotnet pack $project -c Release -o artifacts/packages -p:Version=$VERSION
          done
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  package-check:
    name: Package check (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
          global-json-file: global.json
      - name: Install lavapipe (Vulkan on the CPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: artifacts
      # Only the layout checker comes from the build: webgpu_dawn and Olve.WebGPU come from the packages
      - run: rm -rf artifacts/native
      - name: Test against the packages
        run: |
          dotnet build tests/Olve.WebGPU.Tests -c Release -p:Version=$VERSION -p:NativeSource=package -o artifacts/package-test
          dotnet artifacts/package-test/Olve.WebGPU.Tests.dll --output Detailed

  package-check-android:
    name: Package check (android, emulator)
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install android
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages
      # Only the layout checker comes from the build: webgpu_dawn comes from Olve.WebGPU.Native
      - uses: actions/download-artifact@v8
        with:
          name: native-android
          path: artifacts
      - run: rm -rf artifacts/native
      - name: Install the Android platform and build tools the workload targets
        run: dotnet build tests/Olve.WebGPU.Tests.Android -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory=$ANDROID_HOME -p:AcceptAndroidSDKLicenses=True
      - name: Build the Android test runner against the packages
        run: dotnet build tests/Olve.WebGPU.Tests.Android -c Release -p:Version=$VERSION -p:NativeSource=package -p:AndroidSdkDirectory=$ANDROID_HOME
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the checks on an Android 14 emulator (Vulkan through SwiftShader)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: scripts/run-android-tests.sh tests/Olve.WebGPU.Tests.Android/bin/Release/net11.0-android/dev.olve.webgpu.tests-Signed.apk
