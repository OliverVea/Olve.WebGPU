name: Publish

# Builds, tests and packs everything (ci.yml), then pushes the packages to nuget.org.
# Only on a published GitHub release (tag v<version>) or a manual run. Uses nuget.org trusted publishing:
# NuGet/login trades the job's OIDC token for a short-lived API key, so no secret is stored.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version, e.g. 0.1.0
        required: true

jobs:
  version:
    # Not the dawn-<commit> prereleases dawn.yml publishes Dawn's source builds on
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    # ci.yml's first job publishes Dawn's source builds (dawn.yml)
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}

  # A Dawn bump (dawn-bump.yml) runs here on its branch dawn/<tag>. With everything green, the bump goes onto main
  # (fast-forward only: if main moved meanwhile, this fails and the branch waits for a person) and gets its release.
  promote:
    needs: [version, ci]
    if: startsWith(github.ref, 'refs/heads/dawn/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fast-forward main to the bump
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "::error::main moved since the bump: rebase $GITHUB_REF_NAME onto main and release it by hand"; exit 1; }
          git push origin HEAD:main
      # Made with GITHUB_TOKEN, so it doesn't start this workflow again
      - name: Tag and release v${{ needs.version.outputs.version }}
        run: |
          tag="$(sed -nE 's/^DAWN_TAG=(.*)$/\1/p' dawn/version.env)"
          old="$(git show HEAD~1:dawn/version.env | sed -nE 's/^DAWN_TAG=(.*)$/\1/p')"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Wraps Dawn **$tag** (was $old). The public API is unchanged. Released by dawn-bump.yml after the full CI run."
          git push origin --delete "$GITHUB_REF_NAME"

  publish:
    needs: [ci, promote]
    # After the promotion when there is one (a Dawn bump); otherwise straight after CI
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.promote.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: OliverVea
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
